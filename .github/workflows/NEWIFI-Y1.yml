# newifi y1（联想 newifi mini，MT7620A 16MB）局域网打印扫描一体机服务器
# 打印 = Padavan 内置 USB 打印服务器(u2ec)；扫描 = VirtualHere USB透传给PC(联想原厂驱动)；组网 = ZeroTier
name: Padavan NEWIFI-Y1 (newifi mini) - 局域网打印扫描服务器

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/NEWIFI-Y1.yml", "README.md"]

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  TREE_REPO: lmq8267/padavan-KVR
  TNAME: NEWIFI-MINI

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
          cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
          pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true
    - name: Clone Padavan tree & toolchain
      env:
        KERNEL: 3.4
      run: |
        git clone --depth=1 https://github.com/${TREE_REPO}.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/
    - name: Configure minimal - print + scan + zerotier (16MB slim)
      env:
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        [ -f configs/templates/$TNAME.config ] || { echo "configs/templates/$TNAME.config not found"; exit 1; }
        cp -f configs/templates/$TNAME.config .config
        # === 核心：打印 + USB透传扫描 + ZeroTier + SSH ===
        echo "CONFIG_FIRMWARE_INCLUDE_U2EC=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_LPRD=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_VIRTUALHERE=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config
        # === 精简：16MB flash，关闭与打印扫描无关的大件 ===
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA=y/CONFIG_FIRMWARE_INCLUDE_ARIA=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=y/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=y/CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_XUPNPD=y/CONFIG_FIRMWARE_INCLUDE_XUPNPD=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SMBD36=y/CONFIG_FIRMWARE_INCLUDE_SMBD36=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSH=y/CONFIG_FIRMWARE_INCLUDE_OPENSSH=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_SFTP=y/CONFIG_FIRMWARE_INCLUDE_SFTP=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_VLMCSD=y/CONFIG_FIRMWARE_INCLUDE_VLMCSD=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_NFSD=y/CONFIG_FIRMWARE_INCLUDE_NFSD=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_NFSC=y/CONFIG_FIRMWARE_INCLUDE_NFSC=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y/CONFIG_FIRMWARE_INCLUDE_TCPDUMP=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_PARTED=y/CONFIG_FIRMWARE_INCLUDE_PARTED=n/' .config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_HDPARM=y/CONFIG_FIRMWARE_INCLUDE_HDPARM=n/' .config
        # === y1 TF 卡槽：整套照抄 NEWIFI-D1 板级 MMC 段（同平台 MT7620A 实测通过的完整符号集）===
        # r1 失败：EXPERIMENTAL&&MMC 杂项驱动(IWMC3200TOP) NEW abort；r2 失败：MMC_DEBUG (NEW) abort——缺任一 not set 行都会 silentoldconfig 中止
        _B=configs/boards/NEWIFI-MINI/kernel-3.4.x.config
        sed -i 's/CONFIG_EXPERIMENTAL=y/# CONFIG_EXPERIMENTAL is not set/' $_B
        sed -i '/^# CONFIG_MMC is not set$/d; /^CONFIG_MMC/d; /^# CONFIG_MMC/d; /^# CONFIG_SDIO_UART is not set$/d; /^CONFIG_MTK_MMC/d; /^# CONFIG_MTK_MMC/d; /^# CONFIG_MTK_AEE_KDUMP is not set$/d' $_B
        sed -i '/^# CONFIG_NOP_USB_XCEIV is not set$/a CONFIG_MMC=y\n# CONFIG_MMC_DEBUG is not set\n# CONFIG_MMC_UNSAFE_RESUME is not set\nCONFIG_MMC_BLOCK=y\nCONFIG_MMC_BLOCK_MINORS=8\n# CONFIG_MMC_BLOCK_BOUNCE is not set\n# CONFIG_SDIO_UART is not set\n# CONFIG_MMC_TEST is not set\nCONFIG_MMC_SDHCI=y\n# CONFIG_MMC_SDHCI_PCI is not set\nCONFIG_MMC_SDHCI_PLTFM=y\n# CONFIG_MMC_CB710 is not set\n# CONFIG_MMC_VIA_SDMMC is not set\n# CONFIG_MMC_VUB300 is not set\n# CONFIG_MMC_USHC is not set\nCONFIG_MTK_MMC=y\n# CONFIG_MTK_AEE_KDUMP is not set\n# CONFIG_MTK_MMC_CD_POLL is not set' $_B
        echo ">> y1 MMC full chain (NEWIFI-D1 parity) patched:"; grep -E "CONFIG_MMC|CONFIG_MTK_MMC" $_B
    - name: Build Firmware
      env:
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        # v2: 补齐 KVR 上游 httpd 宏不同步（d1 实证 VLMCSD/SHADOWSOCKS undeclared——variables.c 引用但 common.h 未注释恢复）
        _defined=$(grep -E '^[[:space:]]*#define EVM_RESTART_[A-Z_]+' user/httpd/common.h | awk '{print $2}' | sort -u)
        _bit=62
        for _m in $(grep -oE 'EVM_RESTART_[A-Z_]+' user/httpd/variables.c | sort -u); do
          echo "$_defined" | grep -qx "$_m" || { echo "#define $_m (1ULL << $_bit)" >> user/httpd/common.h; _bit=$(( _bit==62 ? 63 : 62 )); }
        done
        echo ">> httpd EVM_RESTART macro patch applied"
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/
        ls -lh /opt/images/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: padavan-NEWIFI-Y1-trx
        path: /opt/images/*
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: NEWIFI-Y1-r${{ github.run_number }}
        files: /opt/images/*
